name: VONO Streamer (Android TV)

# Builds the VONO Streamer Android TV APK entirely in CI — no local Android
# Studio / Gradle / SDK required on anyone's machine.
#
#   • Manual run (workflow_dispatch)  → always builds a DEBUG apk (installable for
#                                        testing); also builds a signed RELEASE apk
#                                        IF the signing secrets are configured.
#   • Tag push `streamer-v1.2.3`      → builds the signed RELEASE apk and attaches
#                                        it (plus debug) to a GitHub Release, which
#                                        is what the in-app Downloads page serves.
#
# Required repo secrets for a SIGNED release (Settings → Secrets → Actions):
#   VONO_KEYSTORE_BASE64     base64 of the release keystore (.jks)
#   VONO_KEYSTORE_PASSWORD   keystore password
#   VONO_KEY_ALIAS           key alias
#   VONO_KEY_PASSWORD        key password
# Without them the release step is skipped and only the debug APK is produced.

on:
  workflow_dispatch:
  push:
    tags:
      - "streamer-v*"

permissions:
  contents: write # needed by softprops/action-gh-release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamer-tv
    env:
      # Surfaced to step-level `if:` (secrets can't be referenced directly in `if`).
      VONO_KEYSTORE_BASE64: ${{ secrets.VONO_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (install required packages)
        uses: android-actions/setup-android@v3
        with:
          # Explicit list — the action's default includes the removed 'tools' package.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper (8.9)
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/artifacts/VONO-Streamer-debug.apk"

      - name: Decode release keystore
        id: keystore
        if: ${{ env.VONO_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$VONO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vono-release.jks"
          echo "path=$RUNNER_TEMP/vono-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: ${{ env.VONO_KEYSTORE_BASE64 != '' }}
        env:
          VONO_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VONO_KEYSTORE_PASSWORD: ${{ secrets.VONO_KEYSTORE_PASSWORD }}
          VONO_KEY_ALIAS: ${{ secrets.VONO_KEY_ALIAS }}
          VONO_KEY_PASSWORD: ${{ secrets.VONO_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/artifacts/VONO-Streamer-release.apk"

      - name: Note when release signing is skipped
        if: ${{ env.VONO_KEYSTORE_BASE64 == '' }}
        run: echo "::notice::No VONO_KEYSTORE_BASE64 secret set — built DEBUG apk only. Add signing secrets to produce a customer release APK."

      - name: Verify APK(s) — package id, version, signing, SHA-256
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/34.0.0 2>/dev/null || ls -d "$ANDROID_SDK_ROOT"/build-tools/34.0.0)"
          VERIFY="$GITHUB_WORKSPACE/artifacts/verification.txt"
          : > "$VERIFY"
          for apk in "$GITHUB_WORKSPACE"/artifacts/*.apk; do
            [ -e "$apk" ] || continue
            echo "===== $(basename "$apk") =====" | tee -a "$VERIFY"
            "$BT/aapt" dump badging "$apk" | grep -E "^package:|^application-label:|^launchable-activity:|sdkVersion|targetSdkVersion" | tee -a "$VERIFY"
            echo "-- signing --" | tee -a "$VERIFY"
            "$BT/apksigner" verify --print-certs "$apk" 2>&1 | tee -a "$VERIFY" || echo "apksigner: UNSIGNED or verify failed" | tee -a "$VERIFY"
            echo "-- sha256 --" | tee -a "$VERIFY"
            sha256sum "$apk" | tee -a "$VERIFY"
            echo "" | tee -a "$VERIFY"
          done
          echo "----- verification.txt -----"
          cat "$VERIFY"

      - name: Upload APK artifact(s) + verification
        uses: actions/upload-artifact@v4
        with:
          name: vono-streamer-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      # Publishing a public GitHub Release is OPT-IN: it only runs when the repo
      # variable PUBLISH_STREAMER_RELEASE == 'true'. Without it, a tag build still
      # produces the signed APKs as a private CI artifact (above) — no public surface.
      - name: Attach APK(s) to GitHub Release (opt-in)
        if: ${{ startsWith(github.ref, 'refs/tags/streamer-v') && vars.PUBLISH_STREAMER_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
