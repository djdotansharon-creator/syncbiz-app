plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is driven ENTIRELY by environment variables so no keystore or
// password is ever committed. CI (see .github/workflows/streamer-tv.yml) decodes a
// base64 keystore secret to a temp file and exports these vars. When they are absent
// (e.g. a local `assembleDebug`, or `assembleRelease` with no secrets) the release
// build simply stays unsigned — the debug APK always works for testing.
def vonoKeystoreFile = System.getenv('VONO_KEYSTORE_FILE')
def vonoHasSigning = vonoKeystoreFile != null && !vonoKeystoreFile.trim().isEmpty() && file(vonoKeystoreFile).exists()

android {
    namespace 'com.vono.streamer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vono.streamer'
        minSdk 21            // Android TV since Android 5.0 (Lollipop)
        targetSdk 34
        versionCode 14
        versionName '1.9.0-poc'
        multiDexEnabled true // NewPipeExtractor + Rhino + media3 exceed the 64k method limit on minSdk 21
    }

    signingConfigs {
        release {
            if (vonoHasSigning) {
                storeFile file(vonoKeystoreFile)
                storePassword System.getenv('VONO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VONO_KEY_ALIAS')
                keyPassword System.getenv('VONO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed only when the keystore secrets are present; otherwise the
            // release APK is emitted unsigned (app-release-unsigned.apk).
            if (vonoHasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        // NewPipeExtractor uses java.time and other Java 8+ APIs → desugar for minSdk 21.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true   // exposes BuildConfig.VERSION_NAME for the Settings screen
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    // Native appliance core (Phase 1): WS/HTTP + persistent infrastructure store.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Phase 2A: native audio engine (ExoPlayer) — background playback + boot-resume.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // YouTube compatibility path: origin-restricted native↔WebView WebMessage bridge
    // (WebViewCompat.addWebMessageListener). Chosen over addJavascriptInterface because
    // this WebView loads third-party YouTube iframes — addJavascriptInterface exposes to
    // ALL frames with no caller-origin verification.
    implementation 'androidx.webkit:webkit:1.11.0'
    // On-device YouTube resolution (POC): resolve a YouTube video/playlist → direct audio
    // stream URL on the DEVICE's IP, then play through the same ExoPlayer engine. Pinned to a
    // recent release that carries the poToken / androidSdkless fixes for audio-only 403s.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
