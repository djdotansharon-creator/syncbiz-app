pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // NewPipeExtractor (on-device YouTube resolution) is published on JitPack.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "VONO Streamer"
include ':app'
